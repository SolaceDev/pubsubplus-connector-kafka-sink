# This workflow will build and test a Java project with Gradle

name: daily-sanity-master

on:
  push:

  schedule:
  - cron: "0 2 * * *"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      with:
        ref: master
    - name: Setup JDK 1.8
      uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1
      with:
        java-version: 1.8
    - name: Build and test with Gradle
      run: ./gradlew clean integrationTest --tests com.solace.connector.kafka.connect.sink.it.SinkConnectorIT
